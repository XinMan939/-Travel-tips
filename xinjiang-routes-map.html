// ========== 路线系统 ==========
var routeLayer = L.layerGroup().addTo(map);
var chargeLayer = L.layerGroup().addTo(map);
var cityLayer = L.layerGroup().addTo(map);
var currentRoute = 'b';

function positionRouteCard() {
  var panel = document.getElementById('panel');
  var card = document.getElementById('route-card');
  if (panel && card) {
    var rect = panel.getBoundingClientRect();
    card.style.left = rect.left + 'px';
    card.style.top = (rect.bottom + 8) + 'px';
    card.style.width = rect.width + 'px';
  }
}

function segColor(i, total, route) {
  var hueOffset = route === 'b' ? 15 : 200;
  var hue = (hueOffset + i * 35) % 360;
  var sat = 65 + (i % 3) * 8;
  var light = 45 + (i % 4) * 5;
  return 'hsl(' + hue + ',' + sat + '%,' + light + '%)';
}

// Find route object from XJ_ROUTES array
function getRoute(id) {
  if (typeof XJ_ROUTES === 'undefined') return null;
  for (var i = 0; i < XJ_ROUTES.length; i++) {
    if (XJ_ROUTES[i].id === id) return XJ_ROUTES[i];
  }
  return null;
}

function renderRoutes() {
  routeLayer.clearLayers();
  chargeLayer.clearLayers();
  cityLayer.clearLayers();

  var route = getRoute(currentRoute);
  if (!route) { console.warn('No route data for ' + currentRoute); return; }

  var segs = route.segs || [];

  for (var i = 0; i < segs.length; i++) {
    var seg = segs[i];
    var pts = seg.pts || [];
    if (pts.length < 2) continue;

    // pts use [lng, lat] — convert to Leaflet [lat, lng]
    var latlngs = [];
    for (var j = 0; j < pts.length; j++) {
      latlngs.push([pts[j][1], pts[j][0]]);
    }

    var color = segColor(i, segs.length, currentRoute);
    L.polyline(latlngs, {
      color: color, weight: 3.5, opacity: 0.85,
      smoothFactor: 1, interactive: false
    }).addTo(routeLayer);

    // Midpoint: geographic center of segment (not array midpoint)
    var z = map.getZoom();
    var dist = seg.dist || 0;
    var time = seg.time || 0;
    if ((dist > 0 || time > 0) && pts.length >= 2) {
      // Compute cumulative distances along the segment
      var cumDist = [0];
      var total = 0;
      for (var k = 1; k < pts.length; k++) {
        var d = L.latLng(pts[k-1][1], pts[k-1][0]).distanceTo(L.latLng(pts[k][1], pts[k][0]));
        total += d;
        cumDist.push(total);
      }
      // Find point at 50% of total distance
      var half = total / 2;
      var mi = 0;
      for (var k = 1; k < cumDist.length; k++) {
        if (cumDist[k] >= half) { mi = k; break; }
      }
      // Interpolate between mi-1 and mi for precise midpoint
      var ratio = (half - cumDist[mi-1]) / (cumDist[mi] - cumDist[mi-1]);
      var midLat = pts[mi-1][1] + (pts[mi][1] - pts[mi-1][1]) * ratio;
      var midLng = pts[mi-1][0] + (pts[mi][0] - pts[mi-1][0]) * ratio;

      var lblSize = Math.max(9, 10 + (z - 4) * 1.8);
      var lbl = Math.round(dist) + 'km·' + time.toFixed(1) + 'h';
      L.marker([midLat, midLng], {
        icon: L.divIcon({
          className: 'geo-l',
          html: '<span style="font-size:' + lblSize + 'px;color:' + color + ';font-weight:bold;text-shadow:0 0 4px rgba(0,0,0,0.7),0 0 8px rgba(0,0,0,0.5)">' + lbl + '</span>',
          iconSize: [0, 0], iconAnchor: [0, 0]
        }),
        interactive: false
      }).addTo(routeLayer);
    }
  }

  renderCityMarkers();
  updateRouteStats();
}

function renderCityMarkers() {
  if (typeof XJ_CITIES === 'undefined') return;
  var cities = XJ_CITIES;
  var seen = {};

  for (var i = 0; i < cities.length; i++) {
    var c = cities[i];
    if (!c.routes || c.routes.indexOf(currentRoute) === -1) continue;
    var cname = c.name;
    if (seen[cname]) continue;
    seen[cname] = true;

    var isHome = (cname === '宁乡');
    var z = map.getZoom();
    var r = Math.max(4, (isHome ? 5 : 4.5) + (z - 4) * 1.2);
    var fs = Math.max(9, 10 + (z - 4) * 1.5);

    L.circleMarker([c.lat, c.lng], {
      radius: r,
      color: isHome ? '#FF6B35' : '#FFB88C',
      weight: isHome ? (z >= 6 ? 3 : 2) : 1.5,
      fillColor: isHome ? '#FF6B35' : '#E8734A',
      fillOpacity: isHome ? 1 : 0.8
    }).addTo(cityLayer).on('click', (function(name) {
      return function() { showCityDetail(name); };
    })(cname));

    // Text label
    L.marker([c.lat, c.lng], {
      icon: L.divIcon({
        className: 'geo-l',
        html: '<span style="font-size:' + fs + 'px;color:' + (isHome ? '#FF6B35' : '#FFB88C') + ';font-weight:bold;text-shadow:0 0 4px rgba(0,0,0,0.8)">' + cname + '</span>',
        iconSize: [0, 0], iconAnchor: [0, 17]
      }),
      interactive: false
    }).addTo(cityLayer);
  }
}

function updateRouteStats() {
  var route = getRoute(currentRoute);
  if (!route) return;

  var segs = route.segs || [];
  var totalDist = 0;
  for (var i = 0; i < segs.length; i++) {
    totalDist += (segs[i].dist || 0);
  }

  var elId = 'rc-stats-' + (currentRoute === 'b' ? 'b' : 'c');
  var el = document.getElementById(elId);
  if (el) {
    el.textContent = Math.round(totalDist) + 'km \u00b7 ' + segs.length + '\u6BB5';
  }

  var bSeg = document.getElementById('rc-seg-b');
  var cSeg = document.getElementById('rc-seg-c');
  if (bSeg) bSeg.classList.toggle('active', currentRoute === 'b');
  if (cSeg) cSeg.classList.toggle('active', currentRoute === 'c');
}

function switchRoute(r) {
  currentRoute = r;
  renderRoutes();
}

function showCityDetail(name) {
  var panel = document.getElementById('city-panel');
  var title = document.getElementById('city-panel-title');
  var body = document.getElementById('city-panel-body');
  if (!panel || !body) return;

  var cd = (typeof DATA !== 'undefined') ? DATA[name] : null;

  if (!cd) {
    body.innerHTML = '<p style="color:#aaa;font-size:13px">暂无该城市详情数据</p>';
    title.textContent = name;
    panel.classList.add('show');
    return;
  }

  title.textContent = name;
  var html = '';

  // Intro
  if (cd.intro) {
    html += '<p style="color:#ccc;font-size:13px;margin-bottom:10px;line-height:1.7">' + cd.intro + '</p>';
  }

  // Spots — desc always visible, m[] details collapsed
  if (cd.spots && cd.spots.length) {
    html += '<h3>🏞️ 景点 (' + cd.spots.length + ')</h3>';
    for (var i = 0; i < cd.spots.length; i++) {
      var sp = cd.spots[i];
      var did = 'spd-' + name.replace(/\s/g,'') + '-' + i;
      html += '<div class="spot-item" onclick="var d=document.getElementById(\'' + did + '\');d.classList.toggle(\'show\')">';
      var restrictedNames = ['艾比湖','可可托海三号矿坑','安集海大峡谷','米兰遗址','楼兰故城遗址','红其拉甫国门','白哈巴村','盘龙古道','天山神秘大峡谷','温宿大峡谷'];
      var rInfo = {};
      for (var ri = 0; ri < RESTRICTED.length; ri++) { rInfo[RESTRICTED[ri].name] = RESTRICTED[ri]; }
      var isR = !!rInfo[sp.n];
      var rBadge = isR ? (rInfo[sp.n].type === 'closed' ? ' 🚫<span style="color:#FF4444;font-size:10px">不对外开放</span>' : ' ⚠️<span style="color:#FF9100;font-size:10px">需办证</span>') : '';
      html += '<div class="spot-name">◆ ' + sp.n + rBadge + (sp.l ? ' <span style="font-size:10px">' + sp.l + '</span>' : '') + '</div>';
      if (sp.desc) html += '<div style="color:#bbb;font-size:12px;line-height:1.6;margin:3px 0">' + sp.desc + '</div>';
      if (sp.m && sp.m.length) html += '<div style="color:#666;font-size:10px">▼ 展开详情</div>';
      html += '<div class="spot-detail" id="' + did + '">';
      if (sp.m && sp.m.length) {
        for (var k = 0; k < sp.m.length; k++) {
          html += '<div style="font-size:11px;color:#999;padding:2px 0"><b>' + sp.m[k][0] + '</b> ' + sp.m[k][1] + ' <span style="font-size:9px">' + sp.m[k][2] + '</span></div>';
        }
      }
      html += '</div></div>';
    }
  }

  // Food — collapsible: name+desc always visible, shops hidden
  if (cd.food && cd.food.length) {
    html += '<h3>🍜 美食 (' + cd.food.length + ')</h3>';
    for (var i = 0; i < cd.food.length; i++) {
      var fd = cd.food[i];
      var fid = 'fd-' + name.replace(/\s/g,'') + '-' + i;
      html += '<div class="cp-food-item" onclick="var d=document.getElementById(\'' + fid + '\');d.classList.toggle(\'show\')">';
      html += '<div style="color:#FFB88C;font-weight:bold;font-size:13px">' + fd.n + (fd.l ? ' <span style="font-size:10px">' + fd.l + '</span>' : '') + '</div>';
      if (fd.desc) html += '<div style="color:#bbb;font-size:12px;line-height:1.6;margin:3px 0">' + fd.desc + '</div>';
      if (fd.shops && fd.shops.length) html += '<div style="color:#666;font-size:10px">▼ ' + fd.shops.length + '家店铺</div>';
      html += '<div class="spot-detail" id="' + fid + '">';
      if (fd.shops && fd.shops.length) {
        for (var j = 0; j < fd.shops.length; j++) {
          var sh = fd.shops[j];
          html += '<div class="shop-box">';
          html += '<div class="sn">🏪 ' + sh.name + (sh.src ? ' <span style="font-size:9px">' + sh.src + '</span>' : '') + '</div>';
          if (sh.addr) html += '<div class="si">📍 ' + sh.addr + '</div>';
          if (sh.price) html += '<div class="si">💰 ' + sh.price + '</div>';
          if (sh.sig) html += '<div class="si">🍽️ ' + sh.sig + '</div>';
          if (sh.taste) html += '<div class="si">👅 ' + sh.taste + '</div>';
          if (sh.parking) html += '<div class="si">🚗 ' + sh.parking + '</div>';
          if (sh.hours) html += '<div class="si">🕐 ' + sh.hours + '</div>';
          if (sh.tags) html += '<div class="si">🏷️ ' + sh.tags + '</div>';
          html += '</div>';
        }
      }
      html += '</div></div>';
    }
  }

  // Accommodation
  if (cd.acc && cd.acc.area) {
    html += '<h3>🏨 住宿推荐</h3>';
    html += '<div style="color:#FFB88C;font-weight:bold">📍 ' + cd.acc.area + '</div>';
    if (cd.acc.desc) html += '<div style="color:#aaa;font-size:12px;margin:4px 0">' + cd.acc.desc + '</div>';
    if (cd.acc.reason) html += '<div style="color:#888;font-size:11px">' + cd.acc.reason + '</div>';
    if (cd.acc.tips) html += '<div style="color:#888;font-size:11px;margin-top:2px">👉 ' + cd.acc.tips + '</div>';
  }

  body.innerHTML = html;
  panel.classList.add('show');
}


function closeCityDetail() {
  document.getElementById('city-panel').classList.remove('show');
}

function toggleRouteUI() {
  var btn = document.getElementById('rb');
  if (map.hasLayer(routeLayer)) {
    map.removeLayer(routeLayer);
    map.removeLayer(chargeLayer);
    map.removeLayer(cityLayer);
    btn.classList.remove('on');
  } else {
    map.addLayer(routeLayer);
    map.addLayer(chargeLayer);
    map.addLayer(cityLayer);
    btn.classList.add('on');
  }
}

// Init
setTimeout(function() {
  positionRouteCard();
  renderRoutes();
}, 500);

map.on('moveend', positionRouteCard);
map.on('zoomend', function() {
  positionRouteCard();
  renderRoutes();
});


</script>
