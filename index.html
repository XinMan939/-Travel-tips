<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>湘桂云贵自驾环线攻略</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;height:100vh;display:flex;flex-direction:column;background:#1a1a2e}
#topbar{background:linear-gradient(135deg,#0f3460,#16213e);padding:8px 16px;color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.4);flex-shrink:0;z-index:999}
#topbar h1{font-size:15px;font-weight:700;text-align:center}
#topbar .route-info{font-size:11px;opacity:.85;text-align:center;margin-top:3px;color:#aab}

/* 核心：flex 布局容器 - 与 v3 一致 */
#mapContainer{flex:1;position:relative;display:flex;overflow:hidden}

/* 地图区域 - flex:1 自动填充剩余空间 */
#map{flex:1;position:relative}

/* 路线选择器 - 左侧竖排 */
#routeSelector{position:absolute;left:8px;top:50%;transform:translateY(-50%);z-index:1000;display:flex;flex-direction:column;gap:5px;background:rgba(255,255,255,.97);border-radius:10px;padding:7px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
#routeSelector button{background:#f0f0f0;color:#333;border:none;padding:10px 7px;border-radius:8px;font-size:12px;cursor:pointer;white-space:nowrap;writing-mode:vertical-rl;text-orientation:mixed;transition:all .2s;min-height:75px;font-weight:500}
#routeSelector button:hover{background:#e0e0e0}
#routeSelector button.active{background:#e94560;color:#fff;font-weight:600}

/* 图层切换 */
#layerBar{position:absolute;top:52px;left:8px;z-index:1000;display:flex;gap:4px;background:rgba(255,255,255,.95);border-radius:8px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#layerBar button{background:#0f3460;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:11px;cursor:pointer}
#layerBar button.active{background:#e94560}

/* 详情面板 - 右上角 */
#detailsPanel{position:absolute;top:48px;right:8px;z-index:1000;width:340px;max-height:calc(100vh - 70px);background:rgba(255,255,255,.98);border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
#detailsHeader{padding:10px 14px;background:linear-gradient(135deg,#0f3460,#16213e);color:#fff;flex-shrink:0}
#detailsHeader h2{font-size:13px;margin-bottom:3px}
#detailsHeader .stats{font-size:10px;opacity:.85}

/* 城市标签 */
#cityTabs{display:flex;flex-wrap:wrap;padding:8px 10px;gap:5px;flex-shrink:0;border-bottom:1px solid #eee;background:#fafafa}
.city-tab{padding:5px 11px;border-radius:15px;font-size:11px;cursor:pointer;background:#e8e8e8;color:#333;transition:all .2s;border:1px solid transparent}
.city-tab:hover{background:#ddd}
.city-tab.active{background:#e94560;color:#fff;font-weight:600}

/* 详情内容 */
#cityDetail{flex:1;overflow-y:auto;padding:14px}
#cityDetail h3{font-size:17px;color:#0f3460;margin-bottom:3px}
#cityDetail .desc{color:#666;font-size:12px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #eee}
.detail-section{margin-bottom:12px}
.detail-section h4{font-size:11px;color:#e94560;margin-bottom:6px;display:flex;align-items:center;gap:4px;font-weight:600}
.detail-section ul{list-style:none;padding:0}
.detail-section li{font-size:11px;color:#333;padding:3px 0;padding-left:14px;position:relative;line-height:1.55}
.detail-section li::before{content:'•';position:absolute;left:0;color:#e94560;font-weight:bold}
.detail-section .highlight{background:#fff0f3;color:#e94560;padding:2px 7px;border-radius:4px;font-size:11px;display:inline-block;margin:2px 0;font-weight:500}

.amap-info-content{font-size:12px;padding:4px;min-width:120px}
.amap-info-content h4{color:#0f3460;margin-bottom:4px;font-size:13px}
.amap-info-content .quick-info{color:#666;font-size:11px;line-height:1.6}

.amap-logo,.amap-copyright{display:none!important}

#cityTabs::-webkit-scrollbar{height:4px}
#cityTabs::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
#cityDetail::-webkit-scrollbar{width:4px}
#cityDetail::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}

@media (max-width: 768px) {
  #routeSelector{left:5px;padding:5px;gap:3px}
  #routeSelector button{padding:8px 5px;font-size:11px;min-height:55px}
  #detailsPanel{width:calc(100% - 16px);left:8px;right:8px;top:auto;bottom:8px;max-height:42vh}
  #layerBar{top:auto;bottom:8px;left:auto;right:8px}
}

/* 景点/美食详情弹窗 */
.popup-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:10000;display:none;align-items:center;justify-content:center}
.popup-overlay.active{display:flex}
.popup-card{background:#fff;border-radius:16px;max-width:460px;width:92%;max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:popupIn .25s ease}
@keyframes popupIn{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.popup-close{position:sticky;top:0;float:right;margin:8px 8px 0 0;width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,.08);font-size:18px;cursor:pointer;z-index:1;display:flex;align-items:center;justify-content:center;transition:background .2s}
.popup-close:hover{background:rgba(0,0,0,.15)}
.popup-header{padding:20px 20px 12px;border-bottom:1px solid #f0f0f0}
.popup-header h3{margin:0;font-size:18px;color:#333}
.popup-header .popup-badge{display:inline-block;background:linear-gradient(135deg,#e94560,#ff6b6b);color:#fff;border-radius:12px;padding:2px 10px;font-size:12px;margin-left:8px}
.popup-body{padding:16px 20px}
.popup-section{margin-bottom:14px}
.popup-section-title{font-size:14px;font-weight:700;color:#e94560;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.popup-section-title::before{content:'';display:inline-block;width:3px;height:14px;background:#e94560;border-radius:2px}
.popup-info-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px;color:#555}
.popup-info-row .label{color:#999;min-width:60px}
.popup-info-row .value{color:#333;font-weight:500;text-align:right;flex:1}
.popup-tag{display:inline-block;background:#f5f5f5;border-radius:6px;padding:2px 8px;font-size:12px;color:#666;margin:2px 2px}
.popup-tag.highlight{background:#fff0f0;color:#e94560}
.popup-tip{background:#fffbe6;border-radius:8px;padding:10px 12px;font-size:13px;color:#8a6d3b;line-height:1.5}
.popup-budget{background:linear-gradient(135deg,#f0fff0,#e8f5e9);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:700;color:#2e7d32}
.food-shop-card{background:#f9f9f9;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.food-shop-card:hover{background:#f0f0f0;transform:translateX(4px)}
.food-shop-name{font-size:14px;font-weight:700;color:#333}
.food-shop-specialty{font-size:12px;color:#888;margin:2px 0}
.food-shop-info{display:flex;gap:8px;font-size:12px;color:#aaa;margin-top:4px}
.food-shop-price{color:#e94560;font-weight:700}
.clickable-attraction{cursor:pointer;color:#e94560;text-decoration:underline;text-decoration-style:dotted;transition:color .2s}
.clickable-attraction:hover{color:#c0392b}
.clickable-food{cursor:pointer;color:#27ae60;text-decoration:underline;text-decoration-style:dotted;transition:color .2s}
.clickable-food:hover{color:#1e8449}

.food-item { cursor: pointer; color: #2d6a4f; }
.food-item:hover { color: #1e8449; text-decoration: underline; }

</style>
</head>

function initMap() {
  map = new AMap.Map("map", {
    zoom: 6,
    center: [105, 26],
    viewMode: "2D",
    mapStyle: "amap://styles/normal"
  });
  switchRoute('route1');
}


function switchRoute(routeKey) {
  currentRoute = routeKey;
  var d = allData.routes[routeKey];
  if (!d) { console.error('Route not found:', routeKey); return; }
  
  document.getElementById('routeInfo').innerHTML = 
    '<strong style="font-size:14px;color:#E53935;">' + d.name + '</strong><br/>' +
    '<span>总里程: <b>' + d.totalDistance + '</b> km</span>&nbsp;&nbsp;' +
    '<span>预计时间: <b>' + d.totalTime + '</b></span>';
  
  updateCityTabs(d);
  drawRoutes(d);
  
  // Update active button state
  document.querySelectorAll('#routeSelector button').forEach(function(btn) {
    btn.classList.remove('active');
    if (btn.getAttribute('data-route') === routeKey) btn.classList.add('active');
  });
}

function updateCityTabs(data) {
  var html = '';
  var seen = {};
  data.cities.forEach(function(city) {
    var dn = displayNames[city.name] || city.name;
    if (seen[dn]) return;
    seen[dn] = true;
    html += '<div class="city-tab" data-city="' + dn + '" onclick="selectCity(\'' + dn + '\')">' + dn + '</div>';
  });
  document.getElementById('cityTabs').innerHTML = html;
}

function selectCity(cityName) {
  console.log("selectCity called:", cityName);
  currentCity = cityName;
  document.querySelectorAll('.city-tab').forEach(function(el) {
    el.className = el.getAttribute('data-city') === cityName ? 'city-tab active' : 'city-tab';
  });
  var detail = cityDetails[cityName];
  if (!detail) {
    document.getElementById('cityDetail').innerHTML = '<p style="color:#999;text-align:center;padding:20px">暂无详细信息</p>';
    return;
  }
  var dn = displayNames[cityName] || cityName;
  var html = '<h3>' + dn + '</h3><div class="desc">' + detail.desc + ' | ' + detail.days + '</div>';
  if (detail.mustVisit && detail.mustVisit.length) {
    html += '<div class="detail-section"><h4>\uD83D\uDD34 必去景点</h4><ul>';
    detail.mustVisit.forEach(function(s) {
      var attrName = s.replace(/（.*/, '').replace(/\(.*/, '').trim();
      var hasDetail = detail.attractions && detail.attractions.some(function(a) { return a.name === attrName; });
      if (hasDetail) {
        html += '<li class="clickable-attraction" onclick="showAttractionDetail(\''+cityName+'\', \''+attrName+'\')">' + s + ' \u203A</li>';
      } else {
        html += '<li class="food-item" onclick="showFoodDetail(\'' + cityName + '\',\'' + s.replace(/'/g,"\\'") + '\')">' + s + '</li>';
      }
    });
    html += '</ul></div>';
  }
  if (detail.optional && detail.optional.length) {
    html += '<div class="detail-section"><h4>\u26AA 可选景点</h4><ul>';
    detail.optional.forEach(function(s) {
      var attrName2 = s.replace(/（.*/, '').replace(/\(.*/, '').trim();
      var hasDetail2 = detail.attractions && detail.attractions.some(function(a) { return a.name === attrName2; });
      if (hasDetail2) {
        html += '<li class="clickable-attraction" onclick="showAttractionDetail(\''+cityName+'\', \''+attrName2+'\')">' + s + ' \u203A</li>';
      } else {
        html += '<li class="food-item" onclick="showFoodDetail(\'' + cityName + '\',\'' + s.replace(/'/g,"\\'") + '\')">' + s + '</li>';
      }
    });
    html += '</ul></div>';
  }
  if (detail.food && detail.food.length) {
    html += '<div class="detail-section"><h4>\uD83C\uDF5C 美食推荐</h4><ul>';
    detail.food.forEach(function(s) {
      var foodName = s.replace(/（.*/, '').replace(/\(.*/, '').trim();
      var matchedShop = detail.foodShops ? detail.foodShops.find(function(sh) { return sh.specialty.indexOf(foodName) >= 0 || sh.mustOrder.join(',').indexOf(foodName) >= 0; }) : null;
      if (matchedShop) {
        html += '<li class="clickable-food" onclick="showFoodShopDetail(\''+cityName+'\', \''+matchedShop.name+'\')">' + s + ' \uD83C\uDFEA</li>';
      } else {
        html += '<li class="food-item" onclick="showFoodDetail(\'' + cityName + '\',\'' + s.replace(/'/g,"\\'") + '\')">' + s + '</li>';
      }
    });
    html += '</ul></div>';
  }
  if (detail.foodShops && detail.foodShops.length) {
    html += '<div class="detail-section"><h4>\uD83C\uDFEA 推荐店铺</h4>';
    detail.foodShops.forEach(function(shop) {
      html += '<div class="food-shop-card" onclick="showFoodShopDetail(\''+cityName+'\', \''+shop.name.replace(/'/g,"\\'")+'\')">';
      html += '<div class="food-shop-name">' + shop.name + ' \u203A</div>';
      html += '<div class="food-shop-specialty">' + shop.specialty + '</div>';
      html += '<div class="food-shop-info"><span class="food-shop-price">' + shop.price + '</span><span>' + shop.address + '</span></div>';
      html += '</div>';
    });
    html += '</div>';
  }
  if (detail.breakfast && detail.breakfast.length) {
    html += '<div class="detail-section"><h4>\uD83C\uDF05 早餐推荐</h4><ul>';
    detail.breakfast.forEach(function(s) { html += '<li class="food-item" onclick="showFoodDetail(\'' + cityName + '\',\'' + s.replace(/'/g,"\\'") + '\')">' + s + '</li>'; });
    html += '</ul></div>';
  }
  html += '<div class="detail-section"><h4>\uD83C\uDFE8 住宿</h4><div style="font-size:11px;color:#333;line-height:1.8"><div>\uD83D\uDCCD ' + detail.stay + '</div><div>\uD83D\uDCB0 ' + detail.hotelPrice + '</div></div></div>';
  html += '<div class="detail-section"><h4>\uD83D\uDCB0 消费参考</h4><div style="font-size:11px;color:#333;line-height:1.8"><div>\uD83C\uDF7D\uFE0F 餐饮：' + detail.mealPrice + '</div></div></div>';
  html += '<div class="detail-section"><h4>\uD83C\uDF24\uFE0F 天气&穿衣</h4><div style="font-size:11px;color:#333;line-height:1.8"><div>' + detail.weather + '</div><div>\uD83D\uDC54 ' + detail.clothes + '</div></div></div>';
  if (detail.photo && detail.photo.length) {
    html += '<div class="detail-section"><h4>\uD83D\uDCF8 出片地点</h4><ul>';
    detail.photo.forEach(function(s) { html += '<li class="food-item" onclick="showFoodDetail(\'' + cityName + '\',\'' + s.replace(/'/g,"\\'") + '\')">' + s + '</li>'; });
    html += '</ul></div>';
  }
  if (detail.tips && detail.tips.length) {
    html += '<div class="detail-section"><h4>\u26A0\uFE0F 注意事项</h4><ul>';
    detail.tips.forEach(function(s) { html += '<li class="food-item" onclick="showFoodDetail(\'' + cityName + '\',\'' + s.replace(/'/g,"\\'") + '\')">' + s + '</li>'; });
    html += '</ul></div>';
  }
  if (detail.advanceTicket && detail.advanceTicket.length) {
    html += '<div class="detail-section"><h4>\uD83C\uDFAB 提前预订</h4><ul>';
    detail.advanceTicket.forEach(function(s) { html += '<li class="highlight">' + s + '</li>'; });
    html += '</ul></div>';
  }
  document.getElementById('cityDetail').innerHTML = html;
  document.getElementById('cityDetail').scrollTop = 0;
}


function drawRoutes(data) {
  // Clear existing polylines
  polylines.forEach(function(p) { map.remove(p); });
  polylines = [];
  
  // Clear existing markers
  cityMarkers.forEach(function(m) { map.remove(m); });
  cityMarkers = [];
  
  if (!data || !data.routes || data.routes.length === 0) return;

  var colors = ['#FF5722','#E91E63','#4CAF50','#FF9800','#9C27B0','#00BCD4'];
  
  data.routes.forEach(function(seg, idx) {
    if (!seg.polyline || seg.polyline.length < 2) return;
    
    var path = seg.polyline.map(function(p) { return [p[0], p[1]]; });
    
    var pl = new AMap.Polyline({
      path: path,
      strokeColor: colors[idx % colors.length],
      strokeWeight: 4,
      strokeOpacity: 0.85,
      lineJoin: 'round',
      zIndex: 50,
      showDir: true
    });
    
    pl.setMap(map);
    polylines.push(pl);
    
    // Mid-point distance marker
    var midIdx = Math.floor(path.length / 2);
    if (midIdx > 0 && midIdx < path.length && seg.distance) {
      var mkr = new AMap.Marker({
        position: [path[midIdx][0], path[midIdx][1]],
        content: '<div style="background:rgba(255,255,255,0.92);padding:3px 10px;border-radius:12px;font-size:12px;font-weight:bold;color:#333;border:1px solid #ddd;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,0.15);">' + 
                 seg.distance + 'km | ' + (seg.time||'') + '</div>',
        offset: new AMap.Pixel(-40, -15),
        zIndex: 60
      });
      mkr.setMap(map);
      cityMarkers.push(mkr);
    }
  });

  // Draw CITY MARKERS with red dots + name labels
  if (data.cities && data.cities.length > 0) {
    data.cities.forEach(function(ci, ciIdx) {
      if (!ci.lng || !ci.lat) return;
      
      var iconHtml = '<div style="position:relative;">' +
        '<div style="width:16px;height:16px;border-radius:50%;background:#E53935;border:2px solid white;box-shadow:0 2px 6px rgba(229,57,53,0.5);"></div>' +
        '<div style="position:absolute;top:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(229,57,53,0.92);color:white;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:bold;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,0.2);">' +
        ci.name + '</div></div>';
        
      var mk = new AMap.Marker({
        position: [ci.lng, ci.lat],
        content: iconHtml,
        offset: new AMap.Pixel(-8, -8),
        zIndex: 70,
        title: ci.name
      });
      
      mk.setMap(map);
      cityMarkers.push(mk);
      AMap.Event.addListener(mk, 'click', function() { selectCity(displayNames[ci.name] || ci.name); });
    });
  }

  // Fit view to show entire route
  if (polylines.length > 0) {
    map.setFitView(polylines, false, [60,60,60,120]);
  }
}

function setLayer(type) {
  layerGroup.forEach(function(l) { map.remove(l); });
  layerGroup = [];
  document.getElementById('btnRoad').className = '';
  document.getElementById('btnSat').className = '';
  if (type === 'road') {
    map.setMapStyle('amap://styles/normal');
    document.getElementById('btnRoad').className = 'active';
  } else if (type === 'sat') {
    map.setMapStyle('amap://styles/normal');
    var satLayer = new AMap.TileLayer.Satellite();
    var roadLayer = new AMap.TileLayer.RoadNet();
    layerGroup = [satLayer, roadLayer];
    layerGroup.forEach(function(l) { map.add(l); });
    document.getElementById('btnSat').className = 'active';
  }
}

initMap();

// 景点/美食详情弹窗
function showAttractionDetail(cityName, attrName) {
  var city = cityDetails[cityName];
  if (!city || !city.attractions) return;
  var attr = null;
  for (var i = 0; i < city.attractions.length; i++) {
    if (city.attractions[i].name === attrName) { attr = city.attractions[i]; break; }
  }
  if (!attr) return;

  document.getElementById('popupHeader').innerHTML = '<h3>' + attrName + '<span class="popup-badge">景点</span></h3>';
  
  var h = '';
  
  if (attr.address) {
    h += '<div class="popup-section"><div class="popup-section-title">📍 景区地址</div>';
    h += '<div class="popup-info-row"><span class="value">' + attr.address + '</span></div></div>';
  }
  
  if (attr.ticket) {
    h += '<div class="popup-section"><div class="popup-section-title">🎫 门票价格</div>';
    h += '<div class="popup-info-row"><span class="value" style="color:#e74c3c;font-weight:700">' + attr.ticket + '</span></div></div>';
  }
  
  if (attr.sightseeingBus) {
    h += '<div class="popup-section"><div class="popup-section-title">🚌 观光车</div>';
    h += '<div class="popup-info-row"><span class="value">' + attr.sightseeingBus + '</span></div></div>';
  }
  
  if (attr.discount) {
    h += '<div class="popup-section"><div class="popup-section-title">🧑\u200d🎓 优惠政策</div>';
    h += '<div class="popup-tip" style="font-size:13px;line-height:1.6">' + attr.discount.replace(/\n/g, '<br>') + '</div></div>';
  }
  
  if (attr.openingHours) {
    h += '<div class="popup-section"><div class="popup-section-title">⏰ 开放时间</div>';
    h += '<div class="popup-info-row"><span class="value">' + attr.openingHours + '</span></div></div>';
  }
  
  if (attr.parking) {
    h += '<div class="popup-section"><div class="popup-section-title">🚗 停车指南</div>';
    h += '<div class="popup-tip" style="font-size:13px;line-height:1.6">' + attr.parking.replace(/\n/g, '<br>') + '</div></div>';
  }
  
  if (attr.recommendedRoute) {
    h += '<div class="popup-section"><div class="popup-section-title">🗺️ 推荐路线</div>';
    h += '<div class="popup-tip" style="font-size:13px;line-height:1.6">' + attr.recommendedRoute + '</div></div>';
  }
  
  if (attr.highlights && attr.highlights.length > 0) {
    h += '<div class="popup-section"><div class="popup-section-title">🌟 景区特色景点速览（精华）</div>';
    for (var i = 0; i < attr.highlights.length; i++) {
      h += '<div style="padding:8px 12px;background:#f8f9fa;border-radius:8px;margin:6px 0;font-size:13px;line-height:1.6;color:#333">' + attr.highlights[i] + '</div>';
    }
    h += '</div>';
  }

  document.getElementById('popupBody').innerHTML = h;
  document.getElementById('detailPopup').classList.add('active');
}
function showFoodShopDetail(cityName, shopName) {
  var city = cityDetails[cityName];
  if (!city || !city.foodShops) return;
  var shop = null;
  for (var i = 0; i < city.foodShops.length; i++) {
    if (city.foodShops[i].name === shopName) { shop = city.foodShops[i]; break; }
  }
  if (!shop) return;
  document.getElementById('popupHeader').innerHTML = '<h3>' + shopName + '<span class="popup-badge" style="background:linear-gradient(135deg,#27ae60,#2ecc71)">美食</span></h3>';
  var html = '<div class="popup-section"><div class="popup-section-title">特色</div><div style="font-size:14px;color:#555;line-height:1.6">' + shop.specialty + '</div></div>';
  html += '<div class="popup-section"><div class="popup-section-title">必点菜</div>';
  for (var i = 0; i < shop.mustOrder.length; i++) html += '<span class="popup-tag highlight">' + shop.mustOrder[i] + '</span> ';
  html += '</div>';
  html += '<div class="popup-info-row"><span class="label">人均</span><span class="value" style="color:#e94560;font-weight:700">' + shop.price + '</span></div>';
  html += '<div class="popup-info-row"><span class="label">地址</span><span class="value">' + shop.address + '</span></div>';
  if (shop.tips) html += '<div class="popup-section" style="margin-top:8px"><div class="popup-tip">' + shop.tips + '</div></div>';
  document.getElementById('popupBody').innerHTML = html;
  document.getElementById('detailPopup').classList.add('active');
}
function closePopup() { document.getElementById('detailPopup').classList.remove('active'); }
document.addEventListener('click', function(e) { if (e.target.id === 'detailPopup') closePopup(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closePopup(); });
</script>
